services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exchange-status-app
    restart: unless-stopped
    environment:
      PORT: 3000
      EXCHANGE_STATUS_CACHE_TTL_MS: ${EXCHANGE_STATUS_CACHE_TTL_MS:-10000}
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      OKX_API_KEY: ${OKX_API_KEY:-}
      OKX_API_SECRET: ${OKX_API_SECRET:-}
      OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: exchange-status-nginx
    restart: unless-stopped
    depends_on:
      - app
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-_}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
